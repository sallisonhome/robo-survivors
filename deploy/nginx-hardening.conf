# ROBO SURVIVORS — keep server-side and repo files out of public reach.
# Included inside each robosurvivors server{} block by deploy/deploy.sh.
# Dotfiles/dirs (.git, .venv, .github) except ACME challenges used by certbot
location ~ /\.(?!well-known/) { deny all; return 404; }
# Server code, scripts, docs, data files
location ~* \.(py|pyc|sh|md|db|sqlite|sqlite3|env|bak|tmp)$ { deny all; return 404; }
location = /scores.json { deny all; return 404; }
location ^~ /deploy/ { deny all; return 404; }
location ^~ /tasks/ { deny all; return 404; }
# Admin page: never cache, never index
location ^~ /admin/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /admin/index.html;
}
